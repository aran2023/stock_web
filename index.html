<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        body {
            margin: 20px;
            font-family: monospace;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            background: #fff;
        }
    </style>
</head>
<body>
    <div id="output">로딩 중...</div>

    <script>
        const csvUrl = 'https://raw.githubusercontent.com/aran2023/stock_web/main/stock_name.csv';

        async function processQuery() {
            const urlParams = new URLSearchParams(window.location.search);
            const nameParam = urlParams.get('name');
            const codeParam = urlParams.get('code');
            const outputEl = document.getElementById('output');

            if (!nameParam && !codeParam) {
                outputEl.innerText = '';
                return;
            }

            try {
                const response = await fetch(csvUrl);
                const text = await response.text();
                const lines = text.split('\n');

                let stockData = [];
                for (let i = 1; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (!line) continue;
                    let parts = line.split(',');
                    if (parts.length >= 2) {
                        let code = parts[0].trim().replace(/['"]/g, '');
                        let name = parts[1].trim().replace(/['"]/g, '');
                        stockData.push({ code, name });
                    }
                }

                // 1. 종목명으로 코드 검색 (?name=삼성전자)
                if (nameParam) {
                    const cleanName = nameParam.trim().replace(/['"]/g, '');
                    const found = stockData.find(s => s.name === cleanName);
                    outputEl.innerText = found ? found.code : 'NOT_FOUND';
                    return;
                }

                // 2. 코드로 종목명 검색 (?code=005930)
                if (codeParam) {
                    const cleanCode = codeParam.trim().replace(/['"]/g, '');
                    const found = stockData.find(s => s.code === cleanCode);
                    outputEl.innerText = found ? found.name : 'NOT_FOUND';
                    return;
                }
            } catch (error) {
                outputEl.innerText = 'ERROR';
            }
        }

        processQuery();
    </script>
</body>
</html>
