<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        body {
            margin: 20px;
            font-family: monospace;
            font-size: 20px;
            font-weight: bold;
            color: #000;
            background: #fff;
        }
    </style>
</head>
<body>
    <div id="output">로딩 중...</div>

    <script>
        const csvUrl = 'https://raw.githubusercontent.com/aran2023/stock_web/main/stock_name.csv';

        async function processQuery() {
            const urlParams = new URLSearchParams(window.location.search);
            // ?name= 값 하나로 코드/종목명 구분 없이 받음 (?name=삼성전자 또는 ?name=005930)
            const queryRaw = urlParams.get('name') || urlParams.get('code');
            const outputEl = document.getElementById('output');

            if (!queryRaw) {
                outputEl.innerText = '';
                return;
            }

            // 따옴표나 불필요한 앞뒤 공백 제거
            const query = queryRaw.trim().replace(/['"]/g, '');

            try {
                const response = await fetch(csvUrl);
                const text = await response.text();
                const lines = text.split('\n');

                let stockData = [];
                for (let i = 1; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (!line) continue;
                    let parts = line.split(',');
                    if (parts.length >= 2) {
                        let code = parts[0].trim().replace(/['"]/g, '');
                        let name = parts[1].trim().replace(/['"]/g, '');
                        stockData.push({ code, name });
                    }
                }

                // 1. 코드로 먼저 검색해보고 일치하면 -> 종목명(회사명) 반환
                const foundByCode = stockData.find(s => s.code.toUpperCase() === query.toUpperCase());
                if (foundByCode) {
                    outputEl.innerText = foundByCode.name;
                    return;
                }

                // 2. 종목명으로 검색해보고 일치하면 -> 코드(또는 티커) 반환
                const foundByName = stockData.find(s => s.name.toUpperCase() === query.toUpperCase());
                if (foundByName) {
                    outputEl.innerText = foundByName.code;
                    return;
                }

                // 3. 둘 다 없으면 NOT_FOUND
                outputEl.innerText = 'NOT_FOUND';

            } catch (error) {
                outputEl.innerText = 'ERROR';
            }
        }

        processQuery();
    </script>
</body>
</html>
